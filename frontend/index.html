<!DOCTYPE html>
<html>
<head>
    <title>E-commerce Store</title>
    <style>
.login-btn {
    position: absolute;
    top: 15px;
    right: 20px;
    background: black;
    color: white;
    padding: 10px 15px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
}

/* Cart button (bottom center) */
.cart-btn {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: green;
    color: white;
    padding: 12px 20px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: bold;
}

/* Hover effects */
.login-btn:hover {
    background: #333;
}

.cart-btn:hover {
    background: darkgreen;
}
    body {
    

        font-family: Arial;
        background: #f5f5f5;
        margin: 0;
        padding: 0;
    }

    h1 {
        background: black;
        color: white;
        padding: 15px;
        margin: 0;
    }

    a {
        display: block;
        margin: 15px;
        text-decoration: none;
        font-weight: bold;
    }

    #products {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
    }

    .product {
        background: white;
        padding: 15px;
        margin: 15px;
        width: 220px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        text-align: center;
    }

    img {
        width: 150px;
        height: 150px;
        object-fit: cover;
        border-radius: 10px;
    }

    button {
        background: black;
        color: white;
        padding: 8px;
        border: none;
        cursor: pointer;
        margin-top: 10px;
        .cart-btn {
    display: inline-block;
    background: green;
    color: white;
    padding: 10px 15px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
}

.cart-btn:hover {
    background: darkgreen;
}
    }
</style>
</head>
<body>
    <h1>Alpha Store</h1>

<a href="login.html" class="login-btn">Login</a>

<div id="products"></div>

<a href="cart.html" class="cart-btn">View Cart</a>

    <a href="login.html" class="cart-btn">Login</a>
    <h1>alpha store</h1>
    <a href="cart.html" class="cart-btn">View Cart</a>
    <div id="products"></div>

    <script>
        fetch("http://localhost:3000/products")
        .then(res => res.json())
        .then(data => {
            const container = document.getElementById("products");

            data.forEach(product => {
                const div = document.createElement("div");
                 div.className = "product";

                div.innerHTML = `
                    <h3>${product.name}</h3>
                    <p>Price: ₹${product.price}</p>
                    <p>${product.description}</p>
                    <button onclick="addToCart(${product.id})">Add to Cart</button>
                    <img src="${product.image}" width="150" />
                    <hr>
                `;

                container.appendChild(div);
            });
        });

        function addToCart(id) {
            fetch("http://localhost:3000/cart", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ productId: id })
            })
            .then(res => res.json())
            .then(data => {
                alert("Added to cart");
            });
        }
    </script>

</body>
</html>
