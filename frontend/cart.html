<!DOCTYPE html>
<html>
<head>
    <title>Cart</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            text-align: center;
        }

        .item {
            background: white;
            padding: 10px;
            margin: 10px auto;
            width: 200px;
            border-radius: 10px;
        }

        button {
            background: green;
            color: white;
            padding: 10px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Your Cart</h1>

    <div id="cart"></div>

    <button onclick="placeOrder()">Place Order</button>

    <script>
        function loadCart() {
            fetch("http://localhost:3000/cart")
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById("cart");
                container.innerHTML = "";

                let total = 0;

                if (data.length === 0) {
                    container.innerHTML = "<p>Your cart is empty</p>";
                    return;
                }

                data.forEach(item => {
                    total += item.price;

                    const div = document.createElement("div");
                    div.className = "item";

                    div.innerHTML = `
                        <h3>${item.name}</h3>
                        <p>₹${item.price}</p>
                        <button onclick="removeItem(${item.id})">Remove</button>
                    `;

                    container.appendChild(div);
                });

                const totalDiv = document.createElement("h2");
                totalDiv.innerText = "Total: ₹" + total;
                container.appendChild(totalDiv);
            });
        }

        function removeItem(id) {
            fetch(`http://localhost:3000/cart/${id}`, {
                method: "DELETE"
            }).then(() => loadCart());
        }

        function placeOrder() {
            fetch("http://localhost:3000/order", {
                method: "POST"
            }).then(() => {
                alert("Order placed!");
                loadCart();
            });
        }

        loadCart();
    </script>

</body>
</html>
